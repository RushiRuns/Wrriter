<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: wrriter-vault:; font-src 'self'; connect-src 'self';" />
    <title>Wrriter Capture</title>
    <script>
      (function() {
        try {
          const params = new URLSearchParams(window.location.search);
          const theme = params.get('theme') || 'dark';
          const accent = params.get('accent') || 'yellow';
          const doc = document.documentElement;
          doc.className = 'wr';
          doc.dataset.theme = theme;
          doc.dataset.accent = accent;
        } catch (_) {}
      })();
    </script>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
